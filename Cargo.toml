[package]
name = "disko"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust filesystem indexing daemon for fast disk-space queries and live metadata"
repository = "https://github.com/olibuijr/disko"
readme = "README.md"
keywords = ["filesystem", "disk-usage", "indexer", "daemon", "treemap"]
categories = ["command-line-utilities", "filesystem"]
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = "0.40"
notify = "6.1"
serde_json = "1"
fs2 = "0.4"
signal-hook = "0.3"
tiny_http = "0.12"
percent-encoding = "2"
argon2 = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
