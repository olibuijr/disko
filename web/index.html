<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f1211">
  <title>Disko</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%239fe77b'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%230f1211' stroke-width='3'/%3E%3Cpath d='M13 32h38M32 13v38M18 20l28 24M18 44l28-24' stroke='%230f1211' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/tree.css">
  <link rel="stylesheet" href="/styles/auth.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <section id="login-screen">
    <form id="login-form" class="login-card">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#9fe77b"/><circle cx="32" cy="32" r="19" fill="none" stroke="#0f1211" stroke-width="3"/><path d="M13 32h38M32 13v38M18 20l28 24M18 44l28-24" stroke="#0f1211" stroke-width="2"/></svg><span>Disko</span></div>
      <h1>Sign in</h1>
      <p>See what is using space on this machine, and clean it up.</p>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required maxlength="1024">
      <button type="submit" class="button">Sign in</button>
      <p id="login-error" role="alert"></p>
    </form>
  </section>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Disko overview"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#9fe77b"/><circle cx="32" cy="32" r="19" fill="none" stroke="#0f1211" stroke-width="3"/><path d="M13 32h38M32 13v38M18 20l28 24M18 44l28-24" stroke="#0f1211" stroke-width="2"/></svg><span>Disko</span></a>
    <nav aria-label="Main navigation">
      <a href="#overview" data-page="overview"><span class="nav-icon" aria-hidden="true">◫</span>Overview</a>
      <a href="#tree" data-page="tree"><span class="nav-icon" aria-hidden="true">▦</span>Disk tree</a>
      <a href="#explorer" data-page="explorer"><span class="nav-icon" aria-hidden="true">⌕</span>Explorer</a>
      <a href="#history" data-page="history"><span class="nav-icon" aria-hidden="true">◷</span>History</a>
    </nav>
    <div class="sidebar-bottom"><span id="version">Disko</span><a href="https://github.com/olibuijr/disko" target="_blank" rel="noreferrer">Source</a></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span id="connection" class="live-pill" role="status"><span class="dot"></span><span>Connecting</span></span><button id="logout" type="button">Sign out</button></header>
    <main id="main" tabindex="-1">
      <div id="error" class="notice error" role="alert" hidden></div>
      <div class="page-heading"><div><h1 id="page-title">Overview</h1><p id="page-subtitle"></p></div><button id="rescan" class="button secondary" type="button"><span aria-hidden="true">↻</span> Rescan now</button></div>
      <div id="page" aria-live="polite"><div class="empty">Loading the index…</div></div>
    </main>
    <footer class="page-footer"><span>Reads file metadata only. Nothing leaves this machine.</span><span id="last-updated"></span></footer>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
